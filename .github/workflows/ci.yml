name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and tests
    # ubuntu-latest ships a running Docker daemon, which is all testcontainers
    # needs: jest's globalSetup starts its own Postgres container and publishes
    # the connection string, so there is deliberately no `services: postgres`
    # here — a second database would only go unused.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # bun's global cache; the lockfile is the key, so a dependency change
      # invalidates it and nothing else does.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test
        env:
          NODE_ENV: test
          # The runner is torn down after the job, and jest's globalTeardown
          # already stops the container, so the Ryuk reaper is dead weight.
          TESTCONTAINERS_RYUK_DISABLED: "true"
